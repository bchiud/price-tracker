[project]
name = "price-tracker"
version = "0.1.0"
description = "Track product prices and get a Discord alert when they drop"
readme = "README.md"
authors = [
    { name = "bchiud", email = "brady.chiu@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "curl-cffi>=0.16.3",
    "discord-py>=2.7.1",
    "httpx>=0.28.1",
    "playwright>=1.64.0",
    "pydantic-settings>=2.16.1",
    "selectolax>=1.0.1",
]

[project.scripts]
price-tracker = "price_tracker.cli:main"

[build-system]
requires = ["uv_build>=0.11.28,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
